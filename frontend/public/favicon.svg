<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="nexmail">
  <!-- Umschlag, hell auf weisser Kachel; dunkel, wenn das System dunkel ist.
       Dieselbe Form wie components/Logo.tsx und tools/symbole.mjs. -->
  <style>
    .grund { fill: #fff }
    .rand { stroke: #0e8f68; stroke-opacity: .35 }
    .klappe { stroke: #12b886 }
    .v1 { stop-color: #34c795 } .v2 { stop-color: #0e8f68 } .v3 { stop-color: #06513d }
    @media (prefers-color-scheme: dark) {
      .grund { fill: #0a1512 }
      .rand { stroke: #23d19e; stroke-opacity: .45 }
      .klappe { stroke: #34d399 }
      .v1 { stop-color: #a7ecd3 } .v2 { stop-color: #1fbf8f } .v3 { stop-color: #0d7f5e }
    }
  </style>
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="10" y1="10" x2="54" y2="54">
      <stop offset="0" class="v1"/><stop offset=".5" class="v2"/><stop offset="1" class="v3"/>
    </linearGradient>
  </defs>
  <rect class="grund" x="2" y="2" width="60" height="60" rx="16"/>
  <rect class="rand" x="2.75" y="2.75" width="58.5" height="58.5" rx="15.3" fill="none" stroke-width="1.5"/>
  <rect x="12" y="18" width="40" height="28" rx="5" fill="none" stroke="url(#g)" stroke-width="4.2"/>
  <path class="klappe" d="M15 21.5 32 34.5 49 21.5" fill="none" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
