[pytest]
testpaths = tests

# ⚠️ **Eine Warnung, die stehen bleibt, wird nach zwei Tagen nicht mehr
# gelesen.** Deshalb sind die beiden, die hier wirklich etwas bedeuten,
# Fehler:
#
# - ``DeprecationWarning`` aus ``app`` — unsere eigene, veraltende Verwendung.
# - ``SAWarning`` — SQLAlchemy meldet damit unter anderem „expected to delete
#   1 row(s); 0 were matched". Genau das trat am 01.09.2026 beim Entfernen
#   eines Benutzers auf: Die Kaskade lief gegen Zeilen, die eine Massenlöschung
#   schon weggeräumt hatte. Harmlos — und deshalb gefährlich, weil dieselbe
#   Meldung beim nächsten Mal eine echte Lücke anzeigt.
filterwarnings =
    error::DeprecationWarning:app.*
    error::sqlalchemy.exc.SAWarning
