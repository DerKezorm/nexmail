# Builds a container image on every change to main and publishes it to the
# GitHub Container Registry. Nobody has to build it themselves — on a NAS,
# `docker compose pull` is enough.
name: Build image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# One run at a time.
#
# ⚠️ Running builds are deliberately **not** cancelled: a half-published image
# is worse than a few minutes of waiting.
concurrency:
  group: docker-image
  cancel-in-progress: false

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          # Beide Dateien, sonst hat der Zwischenspeicher einen anderen
          # Schluessel als die Installation eine Zeile weiter unten.
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # requirements-dev.txt zieht requirements.txt ueber "-r" mit ein, also
      # fehlt nichts. Der Unterschied ist pytest: Frueher stand hier ein
      # nacktes "pytest", und pip nahm die neueste Fassung von PyPI - am
      # 03.09.2026 also 9.1.1, waehrend die Entwicklung auf dem gepinnten
      # 8.4.2 misst. Ein ganzer Hauptsprung Unterschied, und niemand haette
      # gemerkt, ob ein roter Lauf am Code oder an der Fassung liegt.
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q

      # On a release the version in the code must match the tag. Otherwise the
      # about page reports a different version than the one that is actually
      # installed.
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: backend
        run: |
          IN_CODE=$(python -c "import app; print(app.__version__)")
          AT_TAG="${GITHUB_REF_NAME#v}"
          echo "code: $IN_CODE / tag: $AT_TAG"
          if [ "$IN_CODE" != "$AT_TAG" ]; then
            echo "::error::app/__init__.py says $IN_CODE, the tag says $AT_TAG."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The fast layer next to the browser tests: translation keys, pure
      # helpers, and the width lists in the Playwright configuration. It takes
      # under a second and needs no browser, so there is no reason for it not
      # to run here. The browser tests still need a real mailbox and a running
      # backend; they stay a local step.
      - name: Type-check, fast tests, build and weigh the frontend
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm test
          npm run build
          node tools/gewicht-pruefen.mjs

  image:
    name: Build image
    runs-on: ubuntu-latest
    # Build only once the tests are through — a broken image helps nobody.
    needs: tests
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Needed to build for several processor architectures: NAS devices come
      # with both Intel/AMD and ARM.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out names and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # ⚠️ "latest" deliberately follows the **tag**, not the branch:
          # whoever has "latest" in their compose file gets a released version
          # on the next pull, not whatever was pushed to main a minute ago. The
          # current development state is available as "main".
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
